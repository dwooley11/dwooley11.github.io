<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baylor Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F3EBD8;--green:#154734;--gold:#FFB81C;--muted:#6f6a5e}
*{box-sizing:border-box}
body{margin:0;background:#11110f;color:#1c1c1a;font-family:Inter,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:28px 14px}
h1{font:700 34px/1 Oswald,'Arial Narrow',sans-serif;color:#f3ebd8;margin:0 0 4px;letter-spacing:.5px}
h1 span{color:var(--gold)}
.sub{color:#a9a49b;font-size:13px;margin-bottom:22px}
a.tile{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border-radius:6px;padding:18px;margin-bottom:12px;text-decoration:none;color:inherit;border-left:6px solid var(--green)}
.tile h2{margin:0;font:700 22px Oswald,'Arial Narrow',sans-serif;text-transform:uppercase}
.tile p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tile .go{font:700 22px Oswald,sans-serif;color:var(--green)}
.tile.soon{opacity:.55;border-left-color:#8e8a80;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>BAYLOR <span>STATS</span></h1>
  <div class="sub">Box scores, game flow, shot charts and the numbers worth watching.</div>
  <a class="tile" href="basketball/index.html"><div><h2>Men's Basketball</h2></div><div class="go">›</div></a>
  <a class="tile" href="football/index.html"><div><h2>Football</h2></div><div class="go">›</div></a>
</div>
</body>
</html>
