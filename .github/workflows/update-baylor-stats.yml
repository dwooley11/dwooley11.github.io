name: Update Baylor Stats data

# Pulls ESPN box scores (basketball + football) and Warren Nolan KenPom ranks into
# public/baylor-stats/data, commits any changes, then redeploys the site.
# The pages' Refresh button also pulls live ESPN data in the browser; this job keeps the
# saved copy (and the KenPom ranks, which a browser can't fetch) current.
on:
  schedule:
    - cron: "17 * * 1,2,3,4,8,9,10,11,12 *"   # hourly, August through April
  workflow_dispatch: {}                       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  actions: write

concurrency:
  group: update-baylor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BAYLOR_CACHE: ${{ github.workspace }}/.baylor-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # past seasons' raw ESPN files are cached between runs so they aren't re-downloaded every hour
      - uses: actions/cache@v4
        with:
          path: .baylor-cache
          key: baylor-cache-${{ github.run_id }}
          restore-keys: baylor-cache-
      - name: Pull basketball data
        run: python3 public/baylor-stats/scripts/build_mbb.py
      - name: Pull football data
        run: python3 public/baylor-stats/scripts/build_cfb.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/baylor-stats/data && [ -z "$(git ls-files --others --exclude-standard public/baylor-stats/data)" ]; then
            echo "No changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "baylor-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/baylor-stats/data
          git commit -m "Update Baylor Stats data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # pushes made by this job don't trigger the deploy workflow on their own, so start it here
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
